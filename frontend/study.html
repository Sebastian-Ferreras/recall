<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall - Repaso</title>
    <script src="/js/themeInit.js"></script>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <script src="/js/tailwindTheme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-content antialiased">
    <header class="mx-auto flex max-w-6xl items-center justify-between px-4 pt-8 sm:px-6">
      <a href="/" aria-label="Recall, inicio" class="rounded-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring">
        <img class="h-16 dark:hidden" src="/assets/logo-horizontal.svg" alt="Recall" />
        <img class="hidden h-16 dark:block" src="/assets/logo-horizontal-dark.svg" alt="Recall" />
      </a>
      <div class="flex items-center gap-2">
        <nav aria-label="Principal">
          <a href="/" class="rounded-lg px-3 py-2 text-sm font-medium focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring">Mazos</a>
        </nav>
        <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Cambiar a modo oscuro">
          <svg class="icon size-5" aria-hidden="true"><use href="/assets/icons.svg#i-moon" /></svg>
        </button>
      </div>
    </header>

    <main id="app" class="mx-auto max-w-6xl space-y-6 px-4 pb-16 pt-10 sm:px-6">
      <div class="flex flex-wrap items-end justify-between gap-4 pr-3.5">
        <div class="min-w-0 grow basis-64">
          <h1 id="title" class="-mb-1.5 min-w-0 truncate pb-1.5 text-3xl font-semibold tracking-tight">&nbsp;</h1>
          <p id="summary" class="mt-1 min-h-5 truncate text-sm text-content-muted" aria-live="polite">&nbsp;</p>
        </div>
        <a id="exit" class="btn btn-secondary invisible" href="/"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-back" /></svg>Salir del repaso</a>
      </div>

      <div id="missing" hidden class="mr-3.5 rounded-xl border border-line bg-surface px-6 py-16 text-center">
        <img src="/assets/mark.svg" alt="" class="mx-auto size-14 opacity-80 dark:hidden" />
        <img src="/assets/mark-dark.svg" alt="" class="mx-auto hidden size-14 opacity-80 dark:block" />
        <h2 class="mt-4 text-lg font-semibold">No encontramos este mazo</h2>
        <p class="mx-auto mt-1 max-w-sm text-sm text-content-muted">Puede que se haya borrado o que el enlace este mal escrito.</p>
        <a href="/" class="btn btn-primary mt-5">Volver a mis mazos</a>
      </div>

      <div id="content" class="space-y-6">
        <div id="strip" class="invisible mr-3.5 flex gap-1" role="progressbar" aria-label="Progreso del repaso" aria-valuemin="0"></div>

        <div id="error" hidden role="alert" class="mr-3.5 flex flex-wrap items-center gap-3 rounded-xl border border-danger/30 bg-danger-soft px-4 py-3 text-sm text-danger">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-alert" /></svg>
          <p id="error-text" class="flex-1">No se pudieron cargar las tarjetas del repaso</p>
          <button id="retry" class="btn btn-secondary btn-sm" type="button">Reintentar</button>
        </div>

        <div id="loading" hidden class="mx-auto max-w-sm space-y-5" role="status" aria-label="Cargando tarjetas">
          <div class="mx-auto max-w-[20rem] pb-3.5 pr-3.5"><div class="aspect-[5/7] animate-pulse rounded-xl bg-sunken"></div></div>
          <div class="grid grid-cols-2 gap-3 pr-3.5"><div class="h-12 animate-pulse rounded-lg bg-sunken"></div><div class="h-12 animate-pulse rounded-lg bg-sunken"></div></div>
        </div>

        <div id="empty" hidden class="mr-3.5 rounded-xl border border-dashed border-line-strong bg-surface px-6 py-16 text-center">
          <img src="/assets/mark.svg" alt="" class="mx-auto size-14 dark:hidden" />
          <img src="/assets/mark-dark.svg" alt="" class="mx-auto hidden size-14 dark:block" />
          <h2 class="mt-4 text-lg font-semibold">Este mazo no tiene tarjetas</h2>
          <p class="mx-auto mt-1 max-w-sm text-sm text-content-muted">Necesitas al menos una tarjeta para empezar a repasar.</p>
          <a id="empty-add" href="/" class="btn btn-primary mt-5"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-plus" /></svg>Agregar tarjetas</a>
        </div>

        <div id="session" hidden class="mx-auto max-w-sm space-y-5"></div>

        <div id="result" hidden class="mx-auto max-w-2xl space-y-6"></div>
      </div>
    </main>

    <script type="module">
      import { initThemeToggle } from "/js/theme.js";
      import { initStudyPage } from "/js/study.js";

      initThemeToggle(document.getElementById("theme-toggle"));
      initStudyPage();
    </script>
  </body>
</html>
