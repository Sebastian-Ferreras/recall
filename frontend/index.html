<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
    <!-- Sincrono y antes de pintar para evitar el parpadeo del tema -->
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("recall-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Crect x='8' y='9' width='16' height='14' rx='2' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- El CDN de Tailwind solo compila bloques en linea, por eso esto no puede ir en brand.css -->
    <style type="text/tailwindcss">
      @custom-variant dark (&:where([data-theme="dark"], [data-theme="dark"] *));

      @theme inline {
        --color-canvas: var(--canvas);
        --color-surface: var(--surface);
        --color-sunken: var(--sunken);
        --color-line: var(--line);
        --color-line-strong: var(--line-strong);
        --color-content: var(--content);
        --color-content-muted: var(--content-muted);
        --color-primary: var(--primary);
        --color-primary-hover: var(--primary-hover);
        --color-on-primary: var(--on-primary);
        --color-accent: var(--accent);
        --color-accent-text: var(--accent-text);
        --color-accent-soft: var(--accent-soft);
        --color-success: var(--success);
        --color-success-text: var(--success-text);
        --color-success-soft: var(--success-soft);
        --color-danger: var(--danger);
        --color-on-danger: var(--on-danger);
        --color-danger-soft: var(--danger-soft);
        --color-ring: var(--ring);
        --font-display: Georgia, "Times New Roman", serif;
      }

      @layer components {
        .btn { @apply inline-flex h-10 cursor-pointer items-center justify-center gap-2 rounded-lg px-4 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:cursor-not-allowed disabled:opacity-50; }
        .btn-sm { @apply h-8 px-3; }
        .btn-primary { @apply bg-primary text-on-primary hover:bg-primary-hover; }
        .btn-secondary { @apply border border-line-strong bg-surface text-content hover:bg-sunken; }
        .btn-ghost { @apply text-content-muted hover:bg-sunken hover:text-content; }
        .btn-danger { @apply bg-danger text-on-danger hover:opacity-90; }
        .field { @apply h-10 w-full rounded-lg border border-line-strong bg-surface px-3 text-sm text-content placeholder:text-content-muted focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-ring; }
        .field[aria-invalid="true"] { @apply border-danger; }
        .card { @apply rounded-xl border border-line bg-surface; }
        .badge { @apply inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium; }
      }
    </style>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-content antialiased">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-4xl px-4 py-4">
        <a href="/" class="text-xl font-bold text-indigo-600">Recall</a>
      </div>
    </header>

    <main id="app" class="mx-auto max-w-4xl px-4 py-8">
      <p class="text-slate-600">Bienvenido a Recall, tu aplicacion de flashcards</p>
    </main>
  </body>
</html>
